<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Face Model</title>
  <style>
    body {
      font-family: Arial;
      padding: 40px;
      background: #f5f5f5;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    img {
      max-width: 400px;
      margin-top: 20px;
      display: block;
    }
  </style>
</head>
<body>

  <h1>Face Model Identity Engine</h1>

  <button onclick="generateImage()">Generate Test Image</button>

  <img id="result"/>

<script>
async function generateImage() {

  const res = await fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      prompt: "ultra realistic 18 year old vietnamese girl, natural skin, DSLR photo"
    })
  });

  const data = await res.json();

  if(data.image) {
    document.getElementById("result").src =
      "data:image/png;base64," + data.image;
  } else {
    alert("Error: " + JSON.stringify(data));
  }
}
</script>

</body>
</html>
