<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Face Model Test</title>
  <style>
    body { font-family: Arial; background:#111; color:white; padding:20px; }
    button { padding:10px 20px; background:#7c3aed; color:white; border:none; border-radius:6px; cursor:pointer; }
    img { margin-top:20px; max-width:400px; display:block; }
  </style>
</head>
<body>

<h2>Face Model – Gemini Image Test</h2>

<button onclick="generateImage()">Generate Test Portrait</button>

<div id="status"></div>
<img id="result">

<script>

const API_KEY = "YOUR_API_KEY_HERE";

async function generateImage() {

  document.getElementById("status").innerText = "Generating...";

  const response = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + API_KEY,
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [
          {
            parts: [
              {
                text: "Ultra realistic portrait of an 18 year old girl, DSLR RAW, neutral lighting, front facing, no makeup, real photography, not AI art."
              }
            ]
          }
        ]
      })
    }
  );

  const data = await response.json();

  console.log(data);

  document.getElementById("status").innerText = "Done. Check console.";

}

</script>

</body>
</html>
